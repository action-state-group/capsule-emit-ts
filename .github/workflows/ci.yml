name: CI
on: [push, pull_request]
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { path: capsule-emit-ts }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          {
            repository: action-state-group/agent-action-capsule,
            path: agent-action-capsule,
            ref: 7e112c8b877ad79d4d2a53be7b522a63470a2b1d,
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          {
            repository: ethanyzhang/capsule-emit-go,
            path: capsule-emit-go,
            ref: 280596e03070d6c3333224313fd6aa20b0cb992a,
          }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          {
            node-version: 24,
            cache: npm,
            cache-dependency-path: capsule-emit-ts/package-lock.json,
          }
      - run: npm ci
        working-directory: capsule-emit-ts
      - run: npm run check
        working-directory: capsule-emit-ts
        env:
          {
            AAC_ROOT: ../agent-action-capsule,
            CAPSULE_EMIT_GO_ROOT: ../capsule-emit-go,
          }
      - run: npm run build
        working-directory: capsule-emit-ts
